# Design system from ui-ux-pro-max: Minimalism & Swiss style, dashboard density,
# trust blue primary, Fira Sans / Fira Code ("Dashboard Data" pairing).
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#1E293B"
linkColor = "#1D4ED8"
borderColor = "#E2E8F0"
showWidgetBorder = true
baseRadius = "8px"
font = "Fira Sans:https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
headingFont = "Fira Sans:https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
codeFont = "Fira Code:https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap"
baseFontSize = 15

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
borderColor = "#E2E8F0"

[client]
toolbarMode = "minimal"

[server]
headless = true
